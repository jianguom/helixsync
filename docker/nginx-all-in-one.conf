# nginx config for the all-in-one image: same behaviour as web/nginx.conf, but
# the API upstream is the backend process in this container instead of the
# `server` service on a docker network.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# This container only ever sees plain HTTP (TLS is terminated by the reverse
# proxy in front), so HSTS can't be keyed off our own scheme. Send it only when
# that proxy says the client connection was HTTPS.
map $http_x_forwarded_proto $hsts_header {
    default "";
    https   "max-age=31536000";
}

# Sync snapshots can be 20-60MB of JSON; compress responses so they aren't
# shipped over the wire raw.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/json application/javascript text/javascript text/css;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Match the backend's own sync upload limit (server/src/sync/routes.rs,
    # MAX_UPLOAD_BODY_BYTES ~126MiB) so nginx isn't a tighter bottleneck.
    client_max_body_size 150m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr is rewritten from X-Forwarded-For by conf.d/00-real-ip.conf
        # when the peer is a trusted proxy (see docker/entrypoint.sh).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/v1/ws is a websocket upgrade (server/src/websocket.rs).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering on;
        proxy_buffers 8 64k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 128k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the current hashed bundles, so it must be revalidated on
    # every load or a deploy isn't picked up until a stale copy ages out.
    # add_header below drops the server-level headers, hence the include.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Filenames carry a content hash, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
