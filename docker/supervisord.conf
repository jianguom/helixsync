[supervisord]
nodaemon=true
user=root

[program:server]
command=/app/helixsync-server
autorestart=true
startsecs=5
priority=10
stopsignal=TERM
# The server drains in-flight requests for up to SHUTDOWN_DEADLINE_SECS (30s)
# before closing its database connections.
stopwaitsecs=40
stopasgroup=true
killasgroup=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
startsecs=5
priority=20
stopsignal=QUIT
stopwaitsecs=40
