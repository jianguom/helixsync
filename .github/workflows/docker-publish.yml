name: Docker

# Fork-only workflow: builds the all-in-one image on demand and pushes it to
# Docker Hub. Trigger it from the Actions tab ("Docker" -> "Run workflow"),
# e.g. after "Sync upstream" has merged new upstream code.
#
# Every run gets its own tag based on the upstream VERSION file plus the
# workflow run number, so images never overwrite each other:
#   <VERSION>-build.<run number>    e.g. 1.0.1-build.12, 1.0.1-build.13, ...
# Set the `version` input to publish an explicit tag instead (e.g. 1.0.2).
# `latest` follows the most recent successful build.
#
# VERSION itself is never modified here: it belongs to upstream (their
# release.yml bumps it). Rewriting it in the fork would make main diverge from
# upstream and break the automated sync. Upstream's release.yml is disabled in
# this fork for the same reason.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Docker Hub account that owns the image repository.
#   DOCKERHUB_TOKEN     Docker Hub access token with read/write scope.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish (default: <VERSION>-build.<run number>)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: helixsync
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          tag="${INPUT_VERSION:-$base-build.$GITHUB_RUN_NUMBER}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing helixsync:$tag (upstream VERSION $base)"

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push helixsync
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./docker/Dockerfile.all-in-one
          push: ${{ env.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME || github.repository_owner }}/helixsync:latest
            ${{ env.DOCKERHUB_USERNAME || github.repository_owner }}/helixsync:${{ steps.version.outputs.tag }}
            ${{ env.DOCKERHUB_USERNAME || github.repository_owner }}/helixsync:sha-${{ github.sha }}
          cache-from: type=gha,scope=helixsync
          cache-to: type=gha,mode=max,scope=helixsync
