name: Docker

# Fork-only workflow: builds the server and web images and pushes them to
# Docker Hub. Upstream's release.yml is disabled in this fork (it publishes to
# GHCR and auto-bumps VERSION, which would diverge main from upstream and break
# the automated upstream sync).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Docker Hub account that owns the image repositories.
#   DOCKERHUB_TOKEN     Docker Hub access token with read/write scope.
# Without them the images are still built, but nothing is pushed.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: helixsync-server
            context: server
            dockerfile: server/Dockerfile
          - image: helixsync-web
            context: web
            dockerfile: web/Dockerfile
          # Single-container build of the same app (server + web under nginx),
          # for installs that prefer one image over the two-image split.
          - image: helixsync
            context: .
            dockerfile: docker/Dockerfile.all-in-one
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: ${{ env.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME || github.repository_owner }}/${{ matrix.image }}:latest
            ${{ env.DOCKERHUB_USERNAME || github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME || github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
