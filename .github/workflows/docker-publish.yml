name: Docker

# Fork-only workflow: builds the single all-in-one image (Rust API server plus
# the web dashboard behind nginx) and pushes it to Docker Hub. The two-image
# split (server/Dockerfile + web/Dockerfile) is no longer published; build it
# by hand if it is ever needed.
#
# Upstream's release.yml is disabled in this fork: it publishes to GHCR and
# auto-bumps VERSION on every push, which would diverge main from upstream and
# break the automated upstream sync.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Docker Hub account that owns the image repository.
#   DOCKERHUB_TOKEN     Docker Hub access token with read/write scope.
# Without them the image is still built, but nothing is pushed.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: helixsync
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push helixsync
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./docker/Dockerfile.all-in-one
          push: ${{ env.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME || github.repository_owner }}/helixsync:latest
            ${{ env.DOCKERHUB_USERNAME || github.repository_owner }}/helixsync:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME || github.repository_owner }}/helixsync:sha-${{ github.sha }}
          cache-from: type=gha,scope=helixsync
          cache-to: type=gha,mode=max,scope=helixsync
