name: Sync upstream

# Fork-only workflow: merges GhaziAlibi/helixsync main into this fork.
# The fork adds nothing but these two workflow files, so path-disjoint merges
# never conflict; upstream's release.yml is disabled in this fork so it cannot
# push version-bump commits that would make the next merge conflict.
on:
  schedule:
    # Daily at 03:00 UTC (11:00 Asia/Shanghai).
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      updated: ${{ steps.merge.outputs.updated }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          git remote add upstream https://github.com/GhaziAlibi/helixsync.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream."
            exit 0
          fi

          # A real conflict fails the job loudly instead of being resolved
          # silently; merge the fork's own commits stays linear enough.
          git merge --no-edit upstream/main
          git push origin HEAD:main
          echo "updated=true" >> "$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN does not trigger other workflows, so the
  # image build is called explicitly once the merge has landed.
  docker:
    name: Build images
    needs: sync
    if: needs.sync.outputs.updated == 'true'
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit
